name: Feature request
description: Suggest an improvement or a new capability for siterun.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For anything larger than a small change, this issue is the place to agree the approach before opening a pull request.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where siterun gets in the way.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Site management
        - Database
        - Export, import and Blueprints
        - Settings and appearance
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues and this isn't a duplicate.
          required: true
        - label: This is a feature request, not a security report.
          required: true
