name: Bug report
description: Something in siterun is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please don't include passwords, site data or personal information.
        For a security problem, use the private reporting link instead of opening an issue.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues and this isn't a duplicate.
          required: true
        - label: This isn't a security vulnerability. I'll report those privately.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open siterun.
        2. Create a site named ...
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: siterun version
      description: The version shown in About.
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: mac
    attributes:
      label: Mac
      options:
        - Apple silicon
        - Intel
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "14.6"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove site data, passwords and personal information first.
    validations:
      required: false
